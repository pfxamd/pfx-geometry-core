name: Geometry Core CI
on:
  push:
  pull_request:

jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve deterministic core version
        run: node .pfx/release.mjs --sync
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node examples/first-scene.mjs
      - name: Browser WebGL smoke test and screenshots
        run: npm run test:browser
      - name: Reproducible geometry performance samples
        run: |
          mkdir -p artifacts
          node benchmarks/intersections.mjs > artifacts/intersection-benchmark.json
          node benchmarks/irregular.mjs > artifacts/irregular-benchmark.json
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-core-verification
          path: artifacts/
          if-no-files-found: ignore
      - name: Record current core version and badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node .pfx/release.mjs --publish

