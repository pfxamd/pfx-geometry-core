<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFx Geometry Core — Three.js adapter test</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101317;color:#ebeff0}
main{width:min(1120px,94vw);padding:26px 0}
header,footer{display:flex;justify-content:space-between;align-items:baseline;gap:18px;flex-wrap:wrap}
header h1{font-size:17px;letter-spacing:.01em;font-weight:550;margin:0 0 17px}
header small,footer{font-size:12px;color:#a6b4bf}
.stage{position:relative;height:min(65vh,620px);min-height:360px;border:1px solid #303c43;border-radius:12px;overflow:hidden;background:#111921}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage canvas:active{cursor:grabbing}
.overlay{pointer-events:none;position:absolute;top:22px;left:24px;display:grid;gap:6px}
.kicker{font-size:11px;letter-spacing:.16em;color:#a4c5cf}
.overlay strong{font-size:21px;font-weight:500;letter-spacing:-.03em}
.overlay span{font-size:12px;color:#b4c0c7}
.status{position:absolute;bottom:16px;left:22px;font:12px/1.4 ui-monospace,monospace;color:#bfd8df;pointer-events:none}
footer{padding:12px 0}
</style>
<script type="importmap">
{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/","robust-predicates":"../node_modules/robust-predicates/index.js"}}
</script>
</head>
<body>
<main>
<header><h1>PFx Geometry Core / renderer adapter</h1><small>alpha 0.3.0 · WebGL 2</small></header>
<section class="stage" id="stage" aria-label="Interactive three-dimensional measured geometry">
  <div class="overlay"><span class="kicker">GEOMETRY → RENDERING</span><strong>Measured surfaces.</strong><span>Drag to orbit · Scroll to zoom</span></div>
  <div class="status" id="status">Initializing...</div>
</section>
<footer><span>Source: independent CPU geometry · Bicubic Bézier patch + measured box</span><span>Controls and lighting: Three.js</span></footer>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {vec3,createBox,createBezierPatchMesh,perspectiveCamera} from '../dist/index.js';
import {toThreeBufferGeometry,toThreePerspectiveCamera} from '../adapters/three/index.mjs';
const stage=document.getElementById('stage');
const status=document.getElementById('status');
try{
  const world=new THREE.Scene();
  world.background=new THREE.Color(0x141d25);
  const grid=Array.from({length:4},(_,v)=>Array.from({length:4},(_,u)=>
    vec3((u/3-.5)*2.9,(v/3-.5)*2.9,(u===1||u===2)&&(v===1||v===2)?1.38:0)));
  const patch=toThreeBufferGeometry(createBezierPatchMesh(grid,{uSegments:40,vSegments:40}));
  const measuredBox=toThreeBufferGeometry(createBox(.75,1.15,.55));
  const material=new THREE.MeshPhysicalMaterial({color:0x8fb9b4,metalness:.12,roughness:.33,side:THREE.DoubleSide});
  const surface=new THREE.Mesh(patch,material);
  surface.position.x=-.7;
  world.add(surface);
  const box=new THREE.Mesh(measuredBox,new THREE.MeshStandardMaterial({color:0xc3a98a,metalness:.34,roughness:.32}));
  box.position.set(2.05,-.25,-.05);
  world.add(box);
  world.add(new THREE.HemisphereLight(0xd8f3ff,0x152231,2.5));
  const key=new THREE.DirectionalLight(0xffffff,3.5);
  key.position.set(-2,5,7);world.add(key);
  const rim=new THREE.DirectionalLight(0x88bfff,2.2);
  rim.position.set(3,-2,-4);world.add(rim);
  const aspect=stage.clientWidth/stage.clientHeight;
  const sourceCamera=perspectiveCamera({
    eye:vec3(4.2,3.1,7.2),target:vec3(.35,0,.05),
    fovYRadians:Math.PI/4,aspect,near:.1,far:100,
  });
  const camera=toThreePerspectiveCamera(sourceCamera);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(.35,0,.05);
  controls.enableDamping=false;
  controls.minDistance=3;
  controls.maxDistance=20;
  const draw=()=>{
    renderer.render(world,camera);
    const count=renderer.info.render.triangles;
    status.textContent=`${count} GPU triangles · 2 CPU-defined geometries`;
    window.__pfxGeometryStats={triangles:count,vertices:patch.getAttribute('position').count+measuredBox.getAttribute('position').count};
    document.documentElement.dataset.ready='true';
  };
  const resize=()=>{
    const width=Math.max(1,stage.clientWidth),height=Math.max(1,stage.clientHeight);
    renderer.setSize(width,height,false);
    camera.aspect=width/height;
    camera.updateProjectionMatrix();
    draw();
  };
  controls.addEventListener('change',draw);
  new ResizeObserver(resize).observe(stage);
  resize();
  renderer.domElement.addEventListener('webglcontextlost',()=>{
    status.textContent='WebGL context lost';
    document.documentElement.dataset.ready='error';
  });
  window.addEventListener('pagehide',()=>{
    controls.dispose();
    renderer.dispose();
    patch.dispose();
    measuredBox.dispose();
    material.dispose();
    box.material.dispose();
  },{once:true});
}catch(error){
  status.textContent=`Render failed: ${error.message}`;
  document.documentElement.dataset.ready='error';
  window.__pfxGeometryError=error.message;
  console.error(error);
}
</script>
</body>
</html>
