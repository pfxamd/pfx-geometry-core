<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PFx Geometry Core — solid builders diagnostic</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101419;color:#e8ebef}
    main{width:min(1200px,96vw);padding:25px 0}
    header,footer{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
    h1{font-size:17px;font-weight:570;letter-spacing:-.02em;margin:0 0 16px}
    header small,footer{color:#a8b7c0;font-size:12px}
    .scene{position:relative;width:100%;height:min(68vh,650px);min-height:400px;border:1px solid #32414b;border-radius:10px;overflow:hidden;background:#141e28}
    .scene canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
    .scene canvas:active{cursor:grabbing}
    .hud{position:absolute;left:28px;top:26px;pointer-events:none}
    .hud b{font-weight:550;display:block;font-size:22px;letter-spacing:-.035em}
    .hud small{color:#a9c1c8}
    .status{position:absolute;bottom:18px;left:28px;color:#c7e1e4;font:12px/1.4 ui-monospace,monospace;pointer-events:none}
    footer{padding:12px 0}
  </style>
  <script type="importmap">
  {"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/","robust-predicates":"../node_modules/robust-predicates/index.js"}}
  </script>
</head>
<body>
<main>
  <header><h1>PFx Geometry Core / solid construction</h1><small>alpha 0.4.0 · WebGL 2 · deterministic geometry</small></header>
  <div class="scene" id="scene">
    <div class="hud"><b>Revolution / Extrusion</b><small>Left: measured revolution · Right: convex straight extrusion</small></div>
    <div class="status" id="status">Initializing...</div>
  </div>
  <footer><span>CPU-computed vertices, outward winding and geometric validation</span><span>Drag to orbit · Scroll to zoom</span></footer>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {vec3,revolveProfile,extrudeConvexPolygon,perspectiveCamera} from '../dist/index.js';
import {toThreeBufferGeometry,toThreePerspectiveCamera} from '../adapters/three/index.mjs';

const sceneElement=document.getElementById('scene'),status=document.getElementById('status');
try{
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x141e28);
  const profile=[
    {radius:.55,height:-1.45},
    {radius:.95,height:-1.05},
    {radius:.75,height:-.12},
    {radius:1.25,height:.88},
    {radius:.65,height:1.5},
  ];
  const shape=[
    {x:-.85,y:-.65},{x:.55,y:-.8},{x:.95,y:0},
    {x:.48,y:.82},{x:-.6,y:.74},{x:-1.05,y:0},
  ];
  const revolved=toThreeBufferGeometry(revolveProfile(profile,{radialSegments:64}));
  const extruded=toThreeBufferGeometry(extrudeConvexPolygon(shape,.8));
  const leftMaterial=new THREE.MeshPhysicalMaterial({color:0x87c6ce,metalness:.25,roughness:.28,side:THREE.DoubleSide});
  const rightMaterial=new THREE.MeshStandardMaterial({color:0xe0b58e,metalness:.23,roughness:.32});
  const left=new THREE.Mesh(revolved,leftMaterial);
  left.position.x=-1.7;
  const right=new THREE.Mesh(extruded,rightMaterial);
  right.position.set(1.6,-.1,-.3);
  scene.add(left,right);
  scene.add(new THREE.HemisphereLight(0xd8edff,0x657181,2.5));
  const light=new THREE.DirectionalLight(0xffffff,3.8);light.position.set(-3,6,8);scene.add(light);
  const edge=new THREE.DirectionalLight(0x97c6ff,2.0);edge.position.set(5,0,-3);scene.add(edge);
  const fill=new THREE.DirectionalLight(0xc1d9f0,1.5);
  fill.position.set(-1,-6,1);scene.add(fill);
  const ratio=sceneElement.clientWidth/sceneElement.clientHeight;
  const coreCamera=perspectiveCamera({
    eye:vec3(5,3.2,9),target:vec3(0,0,0),
    fovYRadians:Math.PI/4,aspect:ratio,near:.1,far:100,
  });
  const camera=toThreePerspectiveCamera(coreCamera);
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  sceneElement.insertBefore(renderer.domElement,sceneElement.firstChild);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,0,0);
  controls.enableDamping=false;
  controls.minDistance=4;
  controls.maxDistance=23;
  const render=()=>{
    renderer.render(scene,camera);
    const triangles=renderer.info.render.triangles;
    const vertices=revolved.getAttribute('position').count+extruded.getAttribute('position').count;
    window.__pfxSolidStats={triangles,vertices};
    status.textContent=`${triangles} triangles · 2 deterministic builders`;
    document.documentElement.dataset.ready='true';
  };
  controls.addEventListener('change',render);
  const resize=()=>{
    const width=Math.max(1,sceneElement.clientWidth),height=Math.max(1,sceneElement.clientHeight);
    renderer.setSize(width,height,false);
    camera.aspect=width/height;camera.updateProjectionMatrix();
    render();
  };
  new ResizeObserver(resize).observe(sceneElement);
  resize();
  renderer.domElement.addEventListener('webglcontextlost',()=>{
    status.textContent='WebGL context lost';document.documentElement.dataset.ready='error';
  });
  window.addEventListener('pagehide',()=>{
    controls.dispose();renderer.dispose();
    revolved.dispose();extruded.dispose();
    leftMaterial.dispose();rightMaterial.dispose();
  },{once:true});
}catch(error){
  status.textContent=`Render failed: ${error.message}`;
  window.__pfxSolidError=error.message;
  document.documentElement.dataset.ready='error';
  console.error(error);
}
</script>
</body>
</html>
