<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFx Geometry Core — controlled 3D tube sweep</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,-apple-system,sans-serif}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101419;color:#e8ebef}
main{width:min(1140px,96vw);padding:25px 0}
header,footer{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:570;margin:0 0 16px} header small,footer{color:#a8b7c0;font-size:12px}
.stage{position:relative;width:100%;height:min(68vh,620px);min-height:400px;border:1px solid #33404b;border-radius:10px;overflow:hidden;background:#141e28}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;left:26px;top:24px;pointer-events:none}
.hud strong{font-size:21px;font-weight:550;display:block}
.hud span{font-size:12px;color:#a9c1c8}
.status{position:absolute;bottom:19px;left:26px;color:#c7e1e4;font:12px ui-monospace,monospace;pointer-events:none}
footer{padding-top:12px}
</style>
<script type="importmap">
{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<main>
<header><h1>PFx Geometry Core / constrained path sweep</h1><small>alpha 0.5.0 · WebGL 2</small></header>
<div class="stage" id="stage">
  <div class="hud"><strong>Measured path. Continuous surface.</strong><span>5 waypoints · radius 0.22 · caps enabled</span></div>
  <div class="status" id="status">Initializing…</div>
</div>
<footer><span>Triangle positions and surface normals from the geometry core</span><span>Drag to orbit · Scroll to zoom</span></footer>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {vec3,sweepCircularTube,analyzeMeshTopology,perspectiveCamera} from '../dist/index.js';
import {toThreeBufferGeometry,toThreePerspectiveCamera} from '../adapters/three/index.mjs';

const stage=document.getElementById('stage'),status=document.getElementById('status');
try{
  const path=[
    vec3(-1.4,-1.35,0),vec3(-1.4,-.4,0),vec3(-.8,.5,.3),
    vec3(0,1.4,.5),vec3(1,1.7,.2),
  ];
  const coreMesh=sweepCircularTube(path,{radius:.22,radialSegments:32});
  const topology=analyzeMeshTopology(coreMesh);
  if(!topology.isClosedOriented2Manifold)throw Error('Core rejected tube topology');
  const geometry=toThreeBufferGeometry(coreMesh);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x141e28);
  const material=new THREE.MeshPhysicalMaterial({
    color:0x88c5cc,metalness:.28,roughness:.31,side:THREE.FrontSide,
  });
  const tube=new THREE.Mesh(geometry,material);
  scene.add(tube);
  scene.add(new THREE.HemisphereLight(0xe4f1ff,0x4a586b,2.7));
  const key=new THREE.DirectionalLight(0xffffff,4);
  key.position.set(-4,5,8);scene.add(key);
  const fill=new THREE.DirectionalLight(0x98c9ff,2);
  fill.position.set(3,-3,-5);scene.add(fill);
  const camera=toThreePerspectiveCamera(perspectiveCamera({
    eye:vec3(4,2.4,8),target:vec3(-.2,.1,0),
    fovYRadians:Math.PI/4,aspect:stage.clientWidth/stage.clientHeight,
    near:.1,far:100,
  }));
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  stage.insertBefore(renderer.domElement,stage.firstChild);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(-.2,.1,0);
  controls.minDistance=3;controls.maxDistance=22;controls.enableDamping=false;
  const render=()=>{
    renderer.render(scene,camera);
    const triangles=renderer.info.render.triangles;
    window.__pfxTubeStats={triangles,vertices:coreMesh.positions.length/3,
      boundaryEdges:topology.boundaryEdges,manifold:topology.isClosedOriented2Manifold};
    status.textContent=`${triangles} triangles · 0 topology boundary edges`;
    document.documentElement.dataset.ready='true';
  };
  controls.addEventListener('change',render);
  const resize=()=>{
    const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render();
  };
  new ResizeObserver(resize).observe(stage);resize();
  renderer.domElement.addEventListener('webglcontextlost',()=>{
    document.documentElement.dataset.ready='error';status.textContent='WebGL context lost';
  });
  window.addEventListener('pagehide',()=>{
    controls.dispose();renderer.dispose();geometry.dispose();material.dispose();
  },{once:true});
}catch(error){
  document.documentElement.dataset.ready='error';
  window.__pfxTubeError=error.message;
  status.textContent=`Render failed: ${error.message}`;
  console.error(error);
}
</script>
</body>
</html>
